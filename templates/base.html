<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>LearnNgemba (Bamendjou)</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { overflow-y: scroll; }
      body {
        font-family: system-ui, -apple-system, Arial, sans-serif;
        background-color: #1a1a1a;
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .main-nav {
        display: flex;
        justify-content: flex-start;
        align-items: center;
        gap: 0;
        padding: 0 48px;
        font-size: 18px;
        border-bottom: 2px solid rgba(255,255,255,0.1);
        box-sizing: border-box;
      }
      .main-nav a {
        color: #ffffff;
        text-decoration: none;
        padding: 20px 28px;
        transition: all 0.3s;
        border-bottom: 3px solid transparent;
        position: relative;
        box-sizing: border-box;
      }
      .main-nav a:hover { background-color: rgba(255,255,255,0.05); }
      .main-nav a.active { border-bottom-color: #d32f2f; }
      .main-nav a.home-btn {
        margin-left: auto;
        background-color: #d32f2f;
        border-radius: 6px;
        padding: 12px 18px 16px 18px;
        border-bottom: 3px solid transparent;
      }
      .main-nav a.home-btn:hover { background-color: #b71c1c; }
      .main-nav a.home-btn.active { 
        border-bottom-color: #ffffff;
        padding: 12px 18px 16px 18px;
      }
      .hero {
        text-align: center;
        padding: 60px 24px 40px;
        max-width: 1200px;
        margin: 0 auto;
      }
      .hero h1 { font-size: 48px; margin-bottom: 16px; font-weight: 600; }
      .hero p { font-size: 20px; color: #cccccc; margin-bottom: 40px; }
      .about-section {
        text-align: center;
        max-width: 800px;
        margin: 40px auto 80px;
        padding: 0 24px;
      }
      .about-section h2 { font-size: 40px; margin-bottom: 24px; }
      .about-section p { font-size: 18px; color: #cccccc; margin-bottom: 32px; }
      .grid-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 24px 60px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 12px;
        margin-bottom: 60px;
      }
      .grid-box {
        aspect-ratio: 1;
        min-height: 220px;
        max-width: 100%;
        border-radius: 12px;
        border: 4px solid #2a2a2a;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }
      .grid-box:hover { transform: scale(1.05); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
      .grid-box.red { background-color: #d32f2f; }
      .grid-box.green { background-color: #388e3c; }
      .grid-box.orange { background-color: #f57c00; }
      .grid-box.blue { background-color: #0288d1; }
      .grid-box.empty { background-color: transparent; border: none; cursor: default; }
      .grid-box.empty:hover { transform: none; box-shadow: none; }
      .grid-box img { max-width: 90%; max-height: 90%; object-fit: contain; }
      .grid-box img.long-image { max-width: 153%; max-height: 153%; }
      .grid-box .label {
        position: absolute;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        background-color: rgba(0, 0, 0, 0.7);
        padding: 4px 12px;
        border-radius: 6px;
        font-size: 14px;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.3s;
      }
      .grid-box:hover .label { opacity: 1; }
      .footer {
        margin-top: auto;
        text-align: center;
        padding: 40px 24px;
      }
      .footer h2 { font-size: 32px; margin-bottom: 24px; }
      .github-btn {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        background-color: #d32f2f;
        color: white;
        padding: 14px 32px;
        border-radius: 8px;
        text-decoration: none;
        font-size: 18px;
        font-weight: 500;
        transition: background-color 0.3s;
      }
      .github-btn:hover { background-color: #b71c1c; }
      .flag-stripe {
        height: 12px;
        background: linear-gradient(to right, #2e7d32 0%, #2e7d32 33.33%, #c62828 33.33%, #c62828 66.66%, #fdd835 66.66%, #fdd835 100%);
        margin-top: 24px;
      }
      .copyright { font-size: 14px; color: #888; margin-top: 16px; }
      @media (max-width: 768px) {
        .hero h1 { font-size: 32px; }
        .hero p { font-size: 16px; }
        .grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .grid-box { min-height: 150px; }
        .main-nav { padding: 0 24px; font-size: 16px; }
        .main-nav a { padding: 16px 16px; }
        .main-nav a.home-btn { padding: 10px 14px 14px 14px; }
      }
      @media (max-width: 480px) {
        .hero h1 { font-size: 24px; }
        .hero p { font-size: 14px; }
        .grid { grid-template-columns: repeat(2, 1fr); }
        .grid-box { min-height: 180px; }
        .footer h2 { font-size: 24px; }
        .main-nav { padding: 0 12px; font-size: 14px; }
        .main-nav a { padding: 12px 10px; }
        .main-nav a.home-btn { padding: 8px 12px 12px 12px; }
      }


    </style>
  </head>
  <body>
    {% block content %}{% endblock %}
  </body>
</html>
